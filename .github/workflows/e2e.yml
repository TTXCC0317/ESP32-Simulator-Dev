name: E2E + Golden

on:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # 版本自动读 package.json 的 packageManager 字段，避免双源冲突
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: browser-actions/setup-playwright@v1
        with:
          cache: true
      - run: pnpm build
      - run: pnpm e2e

  golden:
    name: Golden Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # 版本自动读 package.json 的 packageManager 字段，避免双源冲突
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm golden
