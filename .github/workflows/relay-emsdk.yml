# 中转拉取 emscripten/emsdk（国内 Docker Hub 直连/镜像源均不可用，ghcr.io 可达）。
# 手动 dispatch 运行；产物 ghcr.io/<owner>/emsdk:<tag> 供本地 docker pull /
# mpy-build Dockerfile --build-arg EMSDK_IMAGE 使用。
# 注：私有仓库产出的 GHCR 包默认 private，本地匿名拉取前需在
#     GitHub → Packages → emsdk → Package settings 中改为 Public（每 tag 一次性）。
name: relay-emsdk

on:
  workflow_dispatch:
    inputs:
      emsdk_tag:
        description: 'emscripten/emsdk 镜像 tag（如 3.1.45 / 4.0.10）'
        required: true
        default: '4.0.10'

permissions:
  packages: write
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Pull emsdk & push to GHCR
        env:
          OWNER: ${{ github.repository_owner }}
          EMSDK_TAG: ${{ inputs.emsdk_tag }}
        run: |
          IMAGE="ghcr.io/${OWNER,,}/emsdk:${EMSDK_TAG}"
          echo "target: $IMAGE"
          docker pull "emscripten/emsdk:${EMSDK_TAG}"
          docker tag "emscripten/emsdk:${EMSDK_TAG}" "$IMAGE"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE"
